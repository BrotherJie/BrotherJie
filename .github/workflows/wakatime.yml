name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # 02:30 Asia/Shanghai (18:30 UTC)
    - cron: '30 18 * * *'

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const apiKey = process.env.WAKATIME_API_KEY;
            const fence = String.fromCharCode(96).repeat(3);
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const apiBase = 'https://wakatime.com/api/v1/users/current/stats/';

            if (!apiKey) {
              core.setFailed('Missing WAKATIME_API_KEY secret.');
              return;
            }

            async function wakaStats(period) {
              const url = new URL(apiBase + period);
              url.searchParams.set('api_key', apiKey);
              const response = await fetch(url);
              if (!response.ok) {
                throw new Error('WakaTime ' + period + ' request failed: ' + response.status);
              }
              return response.json();
            }

            function formatNumber(value) {
              return new Intl.NumberFormat('en-US').format(Number(value || 0));
            }

            function formatPercent(value) {
              return Number(value || 0).toFixed(2);
            }

            function progressBar(value) {
              const percent = Math.max(0, Math.min(100, Number(value || 0)));
              const filled = Math.round(percent / 4);
              return '█'.repeat(filled) + '░'.repeat(25 - filled);
            }

            function findCategory(stats, name) {
              const categories = stats.data && Array.isArray(stats.data.categories)
                ? stats.data.categories
                : [];
              return categories.find((category) => category.name === name);
            }

            function languageLines(languages) {
              if (!Array.isArray(languages) || languages.length === 0) {
                return 'No coding activity tracked this week.';
              }

              return languages.slice(0, 5).map((language) => {
                const name = String(language.name || 'Other').padEnd(24);
                const text = String(language.text || '').padEnd(16);
                return name + text + progressBar(language.percent) + ' ' + formatPercent(language.percent).padStart(6) + ' %';
              }).join('\n');
            }

            function aiInsights(data) {
              const aiAdditions = Number(data.ai_additions || 0);
              const aiDeletions = Number(data.ai_deletions || 0);
              const humanAdditions = Number(data.human_additions || 0);
              const humanDeletions = Number(data.human_deletions || 0);
              const aiWritten = aiAdditions + humanAdditions
                ? aiAdditions / (aiAdditions + humanAdditions) * 100
                : 0;
              const manualTouch = aiAdditions + aiDeletions + humanAdditions + humanDeletions
                ? (humanAdditions + humanDeletions) / (aiAdditions + aiDeletions + humanAdditions + humanDeletions) * 100
                : 0;
              const promptLength = Number(data.ai_prompt_length_avg || 0);
              const promptsPerSession = Number(data.ai_prompt_events_avg_per_session || 0);
              const reliance = aiWritten >= 66 ? 'AI-Driven' : aiWritten >= 33 ? 'Balanced' : 'Hands-On';
              const promptStyle = promptLength > 1500 ? 'Verbose Prompter' : promptLength >= 500 ? 'Detailed Prompter' : 'Concise Prompter';
              const sessionStyle = promptsPerSession > 1.5 ? 'Iterative Prompter' : 'One-Shot Prompter';
              const reviewStyle = manualTouch >= 50 ? 'Hands-On Reviewer' : 'High AI Trust';

              return [
                '🔎 AI Coding Insights:',
                '🤖 ' + reliance + ' — ' + formatPercent(aiWritten) + '% of written lines came from AI',
                '📚 ' + promptStyle + ' — average ' + formatNumber(promptLength) + ' characters per prompt',
                '🔁 ' + sessionStyle + ' — average ' + formatPercent(promptsPerSession) + ' prompts per session',
                '🚀 ' + reviewStyle + ' — ' + formatPercent(manualTouch) + '% of changed lines were hand-edited',
              ].join('\n');
            }

            function aiStats(latest) {
              const data = latest.data || {};
              const aiCategory = findCategory(latest, 'AI Coding');
              const aiSessions = Number(data.ai_sessions || 0);

              if (!aiCategory || !aiSessions) {
                return '🤖 **AI Coding This Week** \n\n' + fence + 'text\nNo AI Coding Activity Tracked This Week\n' + fence + '\n\n';
              }

              const aiAdditions = Number(data.ai_additions || 0);
              const humanAdditions = Number(data.human_additions || 0);
              const aiWritten = aiAdditions + humanAdditions
                ? aiAdditions / (aiAdditions + humanAdditions) * 100
                : 0;
              let result = '🤖 **AI Coding This Week** \n\n' + fence + 'text\n';
              result += '⏱ AI Coding Time: ' + String(aiCategory.text || '0 mins') + ' (' + formatPercent(aiCategory.percent) + '%)\n\n';
              result += '✍️ ' + formatNumber(aiAdditions) + ' lines written by AI, ' + formatNumber(humanAdditions) + ' lines written by hand (' + formatPercent(aiWritten) + '% AI-written)\n\n';
              result += '🔤 ' + formatNumber(data.ai_input_tokens) + ' Input Tokens, ' + formatNumber(data.ai_output_tokens) + ' Output Tokens\n\n';
              result += '💵 $' + Number(data.ai_model_total_cost || 0).toFixed(2) + ' Estimated AI Cost This Week\n\n';
              result += '🧠 ' + formatNumber(aiSessions) + ' AI Sessions, ' + formatNumber(data.ai_prompt_events_total) + ' AI Prompts\n\n';

              const models = Array.isArray(data.ai_model_breakdown) ? data.ai_model_breakdown : [];
              if (models.length > 0) {
                const totalLines = models.reduce((total, model) => total + Number(model.lines || 0), 0) || 1;
                result += models.map((model) => {
                  const lines = Number(model.lines || 0);
                  const modelPercent = lines / totalLines * 100;
                  return String(model.name || 'Unknown').padEnd(24)
                    + (formatNumber(lines) + ' lines').padEnd(16)
                    + progressBar(modelPercent)
                    + ' ' + formatPercent(modelPercent).padStart(6) + ' %';
                }).join('\n') + '\n\n';
              }

              return result + aiInsights(data) + '\n' + fence + '\n\n';
            }

            const results = await Promise.all([
              wakaStats('last_7_days'),
              wakaStats('all_time'),
            ]);
            const latest = results[0];
            const allTime = results[1];
            const allTimeAi = findCategory(allTime, 'AI Coding');
            const languages = latest.data && Array.isArray(latest.data.languages) ? latest.data.languages : [];
            let stats = '';

            if (allTimeAi) {
              stats += '![AI Code Time](https://img.shields.io/badge/AI%20Code%20Time-'
                + encodeURIComponent(String(allTimeAi.text || '0 mins'))
                + '-blue?style=flat)\n\n';
            }

            stats += '📊 **This Week I Spent My Time On** \n\n'
              + fence + 'text\n'
              + '💬 Programming Languages: \n'
              + languageLines(languages) + '\n'
              + fence + '\n\n'
              + aiStats(latest);

            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'README.md',
              ref: branch,
            });
            const file = response.data;

            if (Array.isArray(file) || !file.content || !file.sha) {
              throw new Error('README.md could not be read as a file.');
            }

            const readme = Buffer.from(file.content, 'base64').toString('utf8');
            const marker = /<!--START_SECTION:waka-->[\s\S]*?<!--END_SECTION:waka-->/;
            if (!marker.test(readme)) {
              throw new Error('WakaTime markers are missing from README.md.');
            }

            const updatedReadme = readme.replace(
              marker,
              '<!--START_SECTION:waka-->\n' + stats + '<!--END_SECTION:waka-->'
            );

            if (updatedReadme === readme) {
              core.info('WakaTime stats are already current.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              branch,
              path: 'README.md',
              message: 'chore: 更新 WakaTime 统计',
              content: Buffer.from(updatedReadme).toString('base64'),
              sha: file.sha,
            });

            core.info('WakaTime stats updated.');
